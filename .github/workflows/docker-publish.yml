name: Build & Publish to Docker Hub

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Every push to main   → builds & pushes with "latest" + short SHA tags
#   • Every semver git tag → builds & pushes with "vX.Y.Z", "vX.Y", "vX" tags
#   • workflow_dispatch    → manual trigger from the Actions UI
#   • workflow_call        → called by the dependency-update workflow
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
  workflow_call:

# Prevent concurrent pushes on the same ref
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push (multi-arch)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so semantic tags resolve correctly
          fetch-depth: 0

      # ── 2. QEMU / Buildx ──────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Authenticate to Docker Hub ─────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Compute image tags & labels ────────────────────────────────────
      #
      #   On a semver tag  (v1.2.3):  1.2.3 · 1.2 · 1 · latest
      #   On a branch push (main):    latest · sha-<short>
      #
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/merkle-demo
          tags: |
            # semver: v1.2.3 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # branch push: latest + sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # ── 5. Build & Push ───────────────────────────────────────────────────
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache — speeds up repeated builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. Summary ────────────────────────────────────────────────────────
      - name: Print published tags
        run: |
          echo "### 🐳 Published Docker Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
