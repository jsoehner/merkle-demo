name: Build & Publish to Docker Hub

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Every push to main   → builds & pushes with "latest" + short SHA tags
#   • Every semver git tag → builds & pushes with "vX.Y.Z", "vX.Y", "vX" tags
#   • workflow_dispatch    → manual trigger from the Actions UI
#   • workflow_call        → called by the dependency-update workflow
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Prevent concurrent pushes on the same ref
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: website
            target: demo-runtime
            image-suffix: -website
          - name: playground
            target: playground-runtime
            image-suffix: -playground

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. QEMU / Buildx ──────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Authenticate to GitHub Container Registry ───────────────────────
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Authenticate to Docker Hub ─────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── 5. Compute image tags & labels ────────────────────────────────────
      #
      #   On a semver tag  (v1.2.3):  1.2.3 · 1.2 · 1 · latest
      #   On a branch push (main):    latest · sha-<short>
      #
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Publish to both Docker Hub and GHCR simultaneously
          images: |
            ${{ secrets.DOCKER_USERNAME }}/merkle-demo${{ matrix.target.image-suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.target.image-suffix }}
          tags: |
            # semver: v1.2.3 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # branch push: latest + sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # ── 6. Build & Push ───────────────────────────────────────────────────
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache — speeds up repeated builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 7. Summary ────────────────────────────────────────────────────────
      - name: Print published tags
        run: |
          echo "### 🐳 Published Docker Tags (${{ matrix.target.name }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

